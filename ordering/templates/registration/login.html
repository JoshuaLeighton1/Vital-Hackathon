<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login | VitalStaff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container" style="max-width: 450px;">
    <div class="text-center mb-4">
        <h1 class="text-success fw-bold">VitalStaff</h1>
        <p class="text-muted">Internal Employee Supplement Portal</p>
    </div>
    
    <div class="card shadow border-0">
        <div class="card-body p-5">
            {% if form.errors %}
                <div class="alert alert-danger">Invalid username or password.</div>
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2">Sign In</button>
            </form>
            <div class="text-center mt-4">
    <p class="small text-muted mb-0">Don't have an account?</p>
    <a href="{% url 'register' %}" class="text-success text-decoration-none fw-bold">Register here</a>
</div>
        </div>
    </div>
</div>
</body>
</html>
