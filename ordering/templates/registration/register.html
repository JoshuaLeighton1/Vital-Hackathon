<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register | VitalStaff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container" style="max-width: 450px;">
    <div class="text-center mb-4">
        <h1 class="text-success fw-bold">VitalStaff</h1>
        <p class="text-muted">Create your internal staff account</p>
    </div>
    
    <div class="card shadow border-0">
        <div class="card-body p-5">
            <form method="post">
                {% csrf_token %}
                
                <!-- Render the form fields dynamically with Bootstrap styling -->
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label text-muted">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">
                                {{ field.errors|striptags }}
                            </div>
                        {% endif %}
                        {% if field.help_text %}
                            <div class="text-muted small mt-1">{{ field.help_text|safe }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                
                <button type="submit" class="btn btn-success w-100 py-2 mt-3">Register</button>
            </form>
            
            <div class="text-center mt-4">
                <p class="small text-muted mb-0">Already have an account?</p>
                <a href="{% url 'login' %}" class="text-success text-decoration-none fw-bold">Login here</a>
            </div>
        </div>
    </div>
</div>

<!-- Add Bootstrap styling to the default Django form inputs -->
<style>
    input, select, textarea {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
    }
</style>
</body>
</html>
